<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Green Snake Game - Agent-Builder Local GPU</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #00ff66;
        }
        h1 {
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #00ff66;
        }
        #score-board {
            font-size: 20px;
            margin-bottom: 10px;
        }
        canvas {
            display: block;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            background-color: #05080c;
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>
    <h1>🐍 NEON SNAKE</h1>
    <div id="score-board">SCORE: <span id="score">0</span></div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <div class="controls">Use Arrow Keys (↑ ↓ ← →) or WASD to navigate</div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gridSize = 20;
        let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        let direction = 'right';
        let nextDirection = 'right';
        let food = {x: 15, y: 10};
        let score = 0;
        let gameOver = false;

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / gridSize)),
                y: Math.floor(Math.random() * (canvas.height / gridSize))
            };
        }

        function draw() {
            ctx.fillStyle = '#05080c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#11221a';
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw food
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0055';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

            // Draw snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? '#00ff88' : '#00cc66';
                ctx.shadowBlur = index === 0 ? 15 : 5;
                ctx.shadowColor = '#00ff88';
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;
        }

        function update() {
            if (gameOver) return;

            direction = nextDirection;
            const head = {x: snake[0].x, y: snake[0].y};

            switch(direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            // Wall wrap-around
            if (head.x < 0) head.x = canvas.width / gridSize - 1;
            if (head.x >= canvas.width / gridSize) head.x = 0;
            if (head.y < 0) head.y = canvas.height / gridSize - 1;
            if (head.y >= canvas.height / gridSize) head.y = 0;

            // Self-collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver = true;
                setTimeout(() => {
                    alert('Game Over! Final Score: ' + score);
                    resetGame();
                }, 50);
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function resetGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            scoreEl.textContent = '0';
            gameOver = false;
            spawnFood();
        }

        function control(e) {
            if ((e.key === 'ArrowUp' || e.key === 'w') && direction !== 'down') nextDirection = 'up';
            else if ((e.key === 'ArrowDown' || e.key === 's') && direction !== 'up') nextDirection = 'down';
            else if ((e.key === 'ArrowLeft' || e.key === 'a') && direction !== 'right') nextDirection = 'left';
            else if ((e.key === 'ArrowRight' || e.key === 'd') && direction !== 'left') nextDirection = 'right';
        }

        document.addEventListener('keydown', control);
        setInterval(() => {
            update();
            draw();
        }, 90);
        spawnFood();
    </script>
</body>
</html>
