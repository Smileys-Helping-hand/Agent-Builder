<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-STORM: 2D Arcade Space Shooter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 2px solid #06b6d4;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3), inset 0 0 20px rgba(6, 182, 212, 0.1);
            background: #020617;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #0b1528 0%, #020617 100%);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 8px #06b6d4;
            pointer-events: none;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .health-bar-bg {
            width: 140px;
            height: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #06b6d4;
            border-radius: 6px;
            overflow: hidden;
        }
        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #06b6d4);
            transition: width 0.15s ease;
        }
        #controls-hint {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            font-family: monospace;
            text-align: center;
        }
        .key-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #334155;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="hud-item">
                <span>SHIELD:</span>
                <div class="health-bar-bg">
                    <div id="health-bar" class="health-bar-fill"></div>
                </div>
            </div>
            <div class="hud-item" style="color: #f59e0b;">
                <span>WAVE:</span> <span id="wave-val">1</span>
            </div>
            <div class="hud-item" style="color: #38bdf8;">
                <span>SCORE:</span> <span id="score-val">0</span>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="550"></canvas>
    </div>

    <div id="controls-hint">
        <span class="key-badge">W A S D</span> / <span class="key-badge">↑ ← ↓ →</span> Move Ship | 
        <span class="key-badge">SPACE</span> Laser Blasters | 
        <span class="key-badge">P</span> Pause / Resume
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-val');
        const waveEl = document.getElementById('wave-val');
        const healthEl = document.getElementById('health-bar');

        // Web Audio Synthesizer for sound effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function playLaserSound() {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        function playExplosionSound() {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        // Parallax Starfield
        const stars = [];
        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.5,
                brightness: Math.random()
            });
        }

        // Player Ship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 70,
            width: 38,
            height: 44,
            speed: 5.5,
            hp: 100,
            maxHp: 100,
            lastShot: 0,
            shotCooldown: 140, // ms
            multiShot: 1,
            multiShotTimer: 0
        };

        let keys = {};
        let lasers = [];
        let enemyLasers = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let score = 0;
        let wave = 1;
        let gameOver = false;
        let isPaused = false;
        let boss = null;

        // Input listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'p') {
                isPaused = !isPaused;
            }
            if (gameOver && (e.key.toLowerCase() === 'r' || e.key === ' ')) {
                resetGame();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function spawnWave(w) {
            wave = w;
            waveEl.textContent = wave;
            enemies = [];

            if (wave % 3 === 0) {
                // Boss Wave!
                boss = {
                    x: canvas.width / 2,
                    y: 80,
                    width: 110,
                    height: 60,
                    hp: 350 + (wave * 50),
                    maxHp: 350 + (wave * 50),
                    speedX: 2.2,
                    lastShot: 0,
                    shotCooldown: 600
                };
            } else {
                boss = null;
                const rows = 3;
                const cols = 7 + Math.min(4, wave);
                const startX = 60;
                const spacingX = (canvas.width - 120) / cols;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        enemies.push({
                            x: startX + c * spacingX,
                            y: 60 + r * 45,
                            width: 30,
                            height: 26,
                            hp: 1 + Math.floor(wave / 2),
                            type: r === 0 ? 'heavy' : 'drone',
                            direction: 1,
                            lastShot: Math.random() * 1000
                        });
                    }
                }
            }
        }

        function createExplosion(x, y, color = '#38bdf8', count = 18) {
            playExplosionSound();
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function spawnPowerup(x, y) {
            if (Math.random() < 0.25) {
                powerups.push({
                    x,
                    y,
                    type: Math.random() > 0.5 ? 'triple_shot' : 'heal',
                    speed: 2,
                    radius: 12
                });
            }
        }

        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 70;
            player.hp = 100;
            player.multiShot = 1;
            player.multiShotTimer = 0;
            score = 0;
            scoreEl.textContent = '0';
            healthEl.style.width = '100%';
            healthEl.style.background = 'linear-gradient(90deg, #10b981, #06b6d4)';
            lasers = [];
            enemyLasers = [];
            particles = [];
            powerups = [];
            gameOver = false;
            spawnWave(1);
        }

        function update() {
            if (gameOver || isPaused) return;

            const now = Date.now();

            // Multi-shot timer countdown
            if (player.multiShotTimer > 0) {
                player.multiShotTimer -= 16;
                if (player.multiShotTimer <= 0) player.multiShot = 1;
            }

            // Player movement
            if (keys['arrowleft'] || keys['a']) player.x = Math.max(player.width / 2, player.x - player.speed);
            if (keys['arrowright'] || keys['d']) player.x = Math.min(canvas.width - player.width / 2, player.x + player.speed);
            if (keys['arrowup'] || keys['w']) player.y = Math.max(player.height / 2, player.y - player.speed);
            if (keys['arrowdown'] || keys['s']) player.y = Math.min(canvas.height - player.height / 2, player.y + player.speed);

            // Player laser firing
            if (keys[' '] && now - player.lastShot > player.shotCooldown) {
                playLaserSound();
                player.lastShot = now;
                if (player.multiShot === 1) {
                    lasers.push({ x: player.x, y: player.y - 20, vx: 0, vy: -10 });
                } else {
                    lasers.push({ x: player.x, y: player.y - 20, vx: 0, vy: -10 });
                    lasers.push({ x: player.x - 12, y: player.y - 15, vx: -2, vy: -9 });
                    lasers.push({ x: player.x + 12, y: player.y - 15, vx: 2, vy: -9 });
                }
            }

            // Update lasers
            lasers.forEach(l => {
                l.x += l.vx;
                l.y += l.vy;
            });
            lasers = lasers.filter(l => l.y > -20 && l.x > 0 && l.x < canvas.width);

            enemyLasers.forEach(el => {
                el.x += el.vx;
                el.y += el.vy;

                // Hit player test
                const dist = Math.hypot(el.x - player.x, el.y - player.y);
                if (dist < player.width / 2) {
                    player.hp -= 12;
                    createExplosion(player.x, player.y, '#ef4444', 10);
                    el.hit = true;
                    const hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
                    healthEl.style.width = hpPct + '%';
                    if (hpPct < 30) healthEl.style.background = '#ef4444';
                    else if (hpPct < 60) healthEl.style.background = '#f59e0b';
                    if (player.hp <= 0) {
                        gameOver = true;
                        createExplosion(player.x, player.y, '#f97316', 40);
                    }
                }
            });
            enemyLasers = enemyLasers.filter(el => !el.hit && el.y < canvas.height + 20);

            // Update Powerups
            powerups.forEach(p => {
                p.y += p.speed;
                const dist = Math.hypot(p.x - player.x, p.y - player.y);
                if (dist < player.width / 2 + p.radius) {
                    p.collected = true;
                    if (p.type === 'triple_shot') {
                        player.multiShot = 3;
                        player.multiShotTimer = 8000;
                    } else if (p.type === 'heal') {
                        player.hp = Math.min(player.maxHp, player.hp + 35);
                        healthEl.style.width = (player.hp / player.maxHp * 100) + '%';
                    }
                    createExplosion(p.x, p.y, '#10b981', 12);
                }
            });
            powerups = powerups.filter(p => !p.collected && p.y < canvas.height + 20);

            // Update Boss if present
            if (boss) {
                boss.x += boss.speedX;
                if (boss.x < 70 || boss.x > canvas.width - 70) {
                    boss.speedX = -boss.speedX;
                }
                if (now - boss.lastShot > boss.shotCooldown) {
                    boss.lastShot = now;
                    enemyLasers.push({ x: boss.x - 30, y: boss.y + 25, vx: -1.5, vy: 5 });
                    enemyLasers.push({ x: boss.x, y: boss.y + 30, vx: 0, vy: 6 });
                    enemyLasers.push({ x: boss.x + 30, y: boss.y + 25, vx: 1.5, vy: 5 });
                }

                // Laser vs Boss collisions
                lasers.forEach(l => {
                    if (Math.abs(l.x - boss.x) < boss.width / 2 && Math.abs(l.y - boss.y) < boss.height / 2) {
                        l.hit = true;
                        boss.hp -= 10;
                        createExplosion(l.x, l.y, '#f59e0b', 4);
                        if (boss.hp <= 0) {
                            createExplosion(boss.x, boss.y, '#f97316', 50);
                            score += 500 * wave;
                            scoreEl.textContent = score;
                            spawnPowerup(boss.x, boss.y);
                            boss = null;
                            setTimeout(() => spawnWave(wave + 1), 1200);
                        }
                    }
                });
                lasers = lasers.filter(l => !l.hit);
            } else {
                // Update standard enemies
                enemies.forEach(e => {
                    // Random enemy shooting
                    if (Math.random() < 0.003 * wave) {
                        enemyLasers.push({ x: e.x, y: e.y + 15, vx: (Math.random() - 0.5) * 1.5, vy: 4.5 });
                    }

                    // Laser vs Enemy collisions
                    lasers.forEach(l => {
                        if (Math.abs(l.x - e.x) < e.width / 2 && Math.abs(l.y - e.y) < e.height / 2) {
                            l.hit = true;
                            e.hp--;
                            createExplosion(e.x, e.y, e.type === 'heavy' ? '#ec4899' : '#06b6d4', 8);
                            if (e.hp <= 0) {
                                e.dead = true;
                                score += e.type === 'heavy' ? 40 : 20;
                                scoreEl.textContent = score;
                                spawnPowerup(e.x, e.y);
                            }
                        }
                    });
                });
                lasers = lasers.filter(l => !l.hit);
                enemies = enemies.filter(e => !e.dead);

                // Wave clear check
                if (enemies.length === 0) {
                    spawnWave(wave + 1);
                }
            }

            // Update particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
            });
            particles = particles.filter(p => p.alpha > 0);

            // Stars scroll
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + s.brightness * 0.6})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Powerups
            powerups.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.type === 'triple_shot' ? '#f59e0b' : '#10b981';
                ctx.shadowBlur = 12;
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'triple_shot' ? '3X' : '+HP', p.x, p.y);
                ctx.restore();
            });

            // Draw Lasers
            lasers.forEach(l => {
                ctx.save();
                ctx.fillStyle = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#06b6d4';
                ctx.fillRect(l.x - 2, l.y - 8, 4, 16);
                ctx.restore();
            });

            enemyLasers.forEach(el => {
                ctx.save();
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#dc2626';
                ctx.fillRect(el.x - 2.5, el.y - 7, 5, 14);
                ctx.restore();
            });

            // Draw Boss
            if (boss) {
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.fillStyle = '#7e22ce';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#a855f7';
                // Boss chassis
                ctx.beginPath();
                ctx.moveTo(0, 30);
                ctx.lineTo(55, -20);
                ctx.lineTo(25, -30);
                ctx.lineTo(0, -10);
                ctx.lineTo(-25, -30);
                ctx.lineTo(-55, -20);
                ctx.closePath();
                ctx.fill();

                // Boss Core
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();

                // Boss HP Bar
                ctx.restore();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                ctx.fillRect(boss.x - 50, boss.y - 45, 100, 8);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(boss.x - 50, boss.y - 45, (boss.hp / boss.maxHp) * 100, 8);
            }

            // Draw Regular Enemies
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.fillStyle = e.type === 'heavy' ? '#ec4899' : '#06b6d4';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;

                ctx.beginPath();
                ctx.moveTo(0, 13);
                ctx.lineTo(15, -10);
                ctx.lineTo(0, -5);
                ctx.lineTo(-15, -10);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Draw Player Ship
            if (!gameOver) {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#06b6d4';

                // Ship Body
                ctx.fillStyle = '#06b6d4';
                ctx.beginPath();
                ctx.moveTo(0, -22);
                ctx.lineTo(19, 16);
                ctx.lineTo(9, 12);
                ctx.lineTo(0, 18);
                ctx.lineTo(-9, 12);
                ctx.lineTo(-19, 16);
                ctx.closePath();
                ctx.fill();

                // Cockpit Glass
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(0, -4, 4, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                // Thruster Flame
                ctx.fillStyle = '#f97316';
                ctx.shadowColor = '#ea580c';
                ctx.beginPath();
                ctx.moveTo(-5, 18);
                ctx.lineTo(0, 26 + Math.random() * 8);
                ctx.lineTo(5, 18);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            // Game Over Banner
            if (gameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ef4444';
                ctx.fillText('CRITICAL SYSTEM FAILURE', canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = '#f3f4f6';
                ctx.font = '16px monospace';
                ctx.shadowBlur = 0;
                ctx.fillText(`FINAL SCORE: ${score}  |  WAVES SURVIVED: ${wave}`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 14px monospace';
                ctx.fillText('PRESS [SPACE] OR [R] TO REBOOT SHIP', canvas.width / 2, canvas.height / 2 + 65);
                ctx.restore();
            }

            if (isPaused) {
                ctx.save();
                ctx.fillStyle = 'rgba(2, 6, 23, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 28px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SYSTEM PAUSED', canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        spawnWave(1);
        gameLoop();
    </script>
</body>
</html>
