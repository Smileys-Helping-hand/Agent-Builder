name: Build & Verify Agent Builder
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # tsc runs as part of `npm run build` (build:server -> tsc && esbuild),
      # so a type error here already fails the build below. Named separately
      # for a clearer failure signal in the Actions UI.
      - name: Typecheck (backend)
        run: npx tsc --noEmit
      # build:server only: `npm run build` also builds the dashboard, whose
      # dependencies are not installed until the steps below.
      - name: Build (backend)
        run: npm run build:server
      - name: Install dashboard dependencies
        run: cd dashboard && npm ci
      - name: Lint (dashboard)
        run: cd dashboard && npx next lint
      # Type-checks and lints as part of the build (next.config.js no longer
      # sets ignoreBuildErrors/ignoreDuringBuilds) — a real failure here
      # fails the build, not just this step.
      - name: Build (dashboard)
        run: cd dashboard && npm run build
      # The app (remote/): what builder.arpcloudsolutions.co.za and the
      # builder itself serve. A static export, so building it type-checks it.
      - name: Install app dependencies
        run: cd remote && npm ci
      - name: Build (app)
        run: cd remote && npm run build
      # Advisory only: 52 pre-existing transitive vulnerabilities (including
      # 3 critical) predate this workflow change and haven't had a
      # remediation pass yet. Surfaced so they're visible in every run
      # instead of only when someone thinks to run `npm audit` by hand —
      # not blocking until that pass happens, or a real fix would turn every
      # push red for issues nothing here caused.
      - name: Dependency audit (advisory)
        run: npm audit --audit-level=high || true
      # The builder runs on Node 22.13+ (node:sqlite is built in from there);
      # the steps above build with 20. Another process holding the database
      # must make the builder wait, and a stray failure in a background job
      # must not end it: both once stopped a customer build mid-pass.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test (database lock, crash guard)
        run: npm run test:sqlite-lock
