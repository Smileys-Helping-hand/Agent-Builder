appId: com.autodevforge.desktop
productName: AutoDev Forge
directories:
  output: release
  buildResources: electron

files:
  - "dist/**"
  - "dashboard/.next/**"
  - "electron/**"
  - "package.json"

asar: true
artifactName: "AutoDev Forge-${os}-${arch}-${version}.${ext}"

extraMetadata:
  main: electron/main.js

win:
  target:
    - nsis
  icon: electron/icon.png

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: electron/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
